name: Build Luma WRTQ-329ACN (Pure OpenWrt)

on:
  workflow_dispatch:
    inputs:
      repo_branch:
        description: '选择要编译的 OpenWrt 版本 (Tag 请带 tag: 前缀)'
        required: true
        default: 'tag:v25.12.6'
        type: choice
        options:
          - openwrt-25.12
          - tag:v25.12.6
          - main

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_INPUT: ${{ inputs.repo_branch }}
  CONFIG_FILE: configs/luma-v25.12.5.config
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 清理不必要的大型环境，释放磁盘空间
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          
          # 更新软件源
          sudo -E apt-get -qq update
          
          # 移除了已在 Ubuntu 24.04 被废弃的 python3-distutils，并补充了 python3-setuptools
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget
          
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          
          # 设置时区并初始化工作目录
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        shell: bash
        run: |
          set -euo pipefail
 
          df -hT "$PWD"
 
          if [[ "$REPO_INPUT" == tag:* ]]; then
            # Tag：完整克隆，再明确检出指定 Tag
            REPO_BRANCH="${REPO_INPUT#tag:}"
 
            git clone "$REPO_URL" openwrt
            git -C openwrt checkout --detach "refs/tags/$REPO_BRANCH"
          else
            # Branch：仅克隆指定分支
            REPO_BRANCH="$REPO_INPUT"
 
            git clone \
              --branch "$REPO_BRANCH" \
              --single-branch \
              "$REPO_URL" openwrt
          fi
 
          # 后续步骤使用规范化后的版本名称
          echo "REPO_BRANCH=$REPO_BRANCH" >> "$GITHUB_ENV"
 
          # 输出实际提交，便于排查版本问题
          git -C openwrt log -1 \
            --format='Commit: %H%nSubject: %s'
 
          ln -sfn /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          [ -e files ] && mv files openwrt/files
          
          # 致命错误阻断：仅确保指定的 .config 文件实际存在
          if [ ! -e "$CONFIG_FILE" ]; then
            echo "::error::Config file not found: $CONFIG_FILE"
            exit 1
          fi
          
          mv "$CONFIG_FILE" openwrt/.config
          cd openwrt
          make defconfig

      - name: Download packages
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Organize firmware-related files
        id: organize-files
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages/
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory (Artifacts)
        uses: actions/upload-artifact@v4
        if: steps.organize-files.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: steps.organize-files.outputs.status == 'success' && !cancelled()
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "Luma WRTQ-329ACN - OpenWrt $REPO_BRANCH" >> release.txt
          echo "Included: Pure Wired Gateway & Xray" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to Release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success' && !cancelled()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 2
          keep_minimum_runs: 2
